<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>屋頂突圍</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* Layout: full-screen WebGL view; HUD pinned to corners; one centered card for menu / pause / game over */
:root {
  --bg: #0a0f18;
  --fg: #eef2f6;
  --muted: #93a1b3;
  --line: rgba(238, 242, 246, .2);
  --coral: #ff5a4e;
  --amber: #ffb547;
  --teal: #46c2cb;
  --violet: #b48cff;
  --panel: rgba(10, 15, 24, .55);
  --font-display: "Chakra Petch", "Noto Sans TC", ui-monospace, monospace;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { position: fixed; inset: 0; }
#app canvas { display: block; width: 100%; height: 100%; }
.lbl { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
#hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.6); }

#crosshair { position: absolute; left: 50%; top: 50%; --gap: 8px; }
#crosshair i { position: absolute; background: var(--fg); box-shadow: 0 0 2px rgba(0,0,0,.8); }
#crosshair .t, #crosshair .b { width: 2px; height: 9px; left: -1px; }
#crosshair .l, #crosshair .r { width: 9px; height: 2px; top: -1px; }
#crosshair .t { top: calc(-9px - var(--gap)); }
#crosshair .b { top: var(--gap); }
#crosshair .l { left: calc(-9px - var(--gap)); }
#crosshair .r { left: var(--gap); }
#crosshair .dot { position: absolute; width: 2px; height: 2px; left: -1px; top: -1px; background: var(--fg); }
#hitmarker { position: absolute; left: 50%; top: 50%; opacity: 0; }
#hitmarker i { position: absolute; width: 2px; height: 10px; background: var(--fg); left: -1px; top: -5px; }
#hitmarker i:nth-child(1) { transform: rotate(45deg) translateY(-11px); }
#hitmarker i:nth-child(2) { transform: rotate(135deg) translateY(-11px); }
#hitmarker i:nth-child(3) { transform: rotate(225deg) translateY(-11px); }
#hitmarker i:nth-child(4) { transform: rotate(315deg) translateY(-11px); }
#hitmarker.kill i { background: var(--coral); height: 14px; }
#scope {
  position: absolute; inset: 0;
  background: radial-gradient(circle at center, transparent 0 33vmin, rgba(0,0,0,.9) 33.4vmin, #000 34vmin);
}
#scope::before, #scope::after { content: ""; position: absolute; background: rgba(0,0,0,.85); }
#scope::before { left: 0; right: 0; top: 50%; height: 1px; }
#scope::after { top: 0; bottom: 0; left: 50%; width: 1px; }
#vignette { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(200, 20, 10, .65) 100%); }
#dmgDir { position: absolute; left: 50%; top: 50%; }
#dmgDir div {
  position: absolute; width: 120px; height: 14px; left: -60px; top: -7px; border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(255, 70, 50, .95), rgba(255, 70, 50, 0) 70%);
}

.hud-tl { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); display: grid; gap: 6px; justify-items: start; }
.wave { font-weight: 900; font-size: 18px; }
.wave b { font-family: var(--font-display); font-size: 26px; color: var(--amber); }
#radar { width: 130px; height: 130px; }
.hud-tr { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); display: grid; gap: 4px; justify-items: end; text-align: right; }
#score { font-family: var(--font-display); font-weight: 700; font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; }
#combo { font-family: var(--font-display); color: var(--amber); min-height: 20px; font-size: 16px; }
#feed { display: grid; gap: 4px; justify-items: end; margin-top: 6px; }
#feed div { background: var(--panel); padding: 3px 10px; border-radius: 3px; font-size: 13px; transition: opacity .4s; }
#feed .hs { color: var(--coral); font-weight: 700; }
#feed .pts { font-family: var(--font-display); color: var(--amber); }
.hud-bl { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; width: min(260px, 44vw); }
.hpnum { display: flex; align-items: baseline; gap: 6px; }
.hpnum b { font-family: var(--font-display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.hpbar { height: 8px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
#hpFill { height: 100%; width: 100%; background: var(--teal); }
.hud-br { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 2px; justify-items: end; text-align: right; }
#wName { font-weight: 700; font-size: 15px; }
.ammo { display: flex; align-items: baseline; gap: 6px; font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.ammo b { font-size: 44px; line-height: 1; }
.ammo b.low { color: var(--coral); }
.ammo span { font-size: 18px; color: var(--muted); }
#slots { display: flex; gap: 6px; font-size: 12px; }
#slots span { padding: 2px 7px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }
#slots span.on { color: var(--bg); background: var(--fg); border-color: var(--fg); text-shadow: none; }
#reloadBar { width: 140px; height: 3px; background: rgba(255,255,255,.12); }
#reloadBar div { height: 100%; width: 0; background: var(--amber); }
#hint { position: absolute; left: 0; right: 0; top: 60%; text-align: center; font-weight: 700; font-size: 15px; color: var(--amber); }
#toast { position: absolute; left: 0; right: 0; bottom: 22%; text-align: center; font-size: 15px; font-weight: 700; opacity: 0; transition: opacity .3s; }
#banner {
  position: absolute; left: 0; right: 0; top: 26%; text-align: center; opacity: 0;
  font-family: var(--font-body); font-weight: 900; font-size: clamp(34px, 7vw, 68px); letter-spacing: .06em;
}
#banner small { display: block; font-size: 16px; color: var(--amber); letter-spacing: .12em; font-weight: 700; }
#banner.show { animation: banner 2s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: translateY(14px); } 15%, 72% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* touch controls */
#touch { position: fixed; inset: 0; pointer-events: none; }
#zoneL, #zoneR { position: absolute; top: 0; bottom: 0; pointer-events: auto; touch-action: none; }
#zoneL { left: 0; width: 45%; }
#zoneR { right: 0; width: 55%; }
#joy { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 1.5px solid rgba(238,242,246,.3); pointer-events: none; }
#joyKnob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(70,194,203,.55); }
.tb {
  position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%;
  border: 1.5px solid rgba(238,242,246,.35); background: rgba(10,15,24,.45); color: var(--fg);
  font: 700 13px var(--font-body); display: grid; place-items: center; padding: 0;
}
.tb.on { background: rgba(238,242,246,.3); }
#tFire { width: 88px; height: 88px; right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(60px + env(safe-area-inset-bottom, 0px)); background: rgba(255,90,78,.35); border-color: var(--coral); font-size: 15px; }
#tAds { width: 58px; height: 58px; right: calc(124px + env(safe-area-inset-right, 0px)); bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
#tJump { width: 58px; height: 58px; right: calc(124px + env(safe-area-inset-right, 0px)); bottom: calc(122px + env(safe-area-inset-bottom, 0px)); }
#tReload { width: 50px; height: 50px; right: calc(40px + env(safe-area-inset-right, 0px)); bottom: calc(162px + env(safe-area-inset-bottom, 0px)); }
#tSwap { width: 46px; height: 46px; right: calc(98px + env(safe-area-inset-right, 0px)); bottom: calc(196px + env(safe-area-inset-bottom, 0px)); }
#tNade { width: 46px; height: 46px; right: calc(162px + env(safe-area-inset-right, 0px)); bottom: calc(196px + env(safe-area-inset-bottom, 0px)); }
#tPause { width: 40px; height: 40px; left: 50%; margin-left: -20px; top: calc(12px + env(safe-area-inset-top, 0px)); font-size: 16px; }
body.touch .hud-br { right: auto; left: 50%; transform: translateX(-50%); bottom: auto; top: calc(60px + env(safe-area-inset-top, 0px)); justify-items: center; text-align: center; }
body.touch .ammo b { font-size: 28px; }
body.touch #slots, body.touch #reloadBar { display: none; }
body.touch .hud-bl { bottom: auto; top: calc(150px + env(safe-area-inset-top, 0px)); width: 130px; }
body.touch .hpnum b { font-size: 22px; }
body.touch #radar { width: 90px; height: 90px; }
body.touch #score { font-size: 26px; }

#overlay {
  position: fixed; inset: 0; display: grid; place-items: center; background: rgba(6, 9, 15, .62);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; overflow-y: auto;
}
.card {
  width: min(560px, 100%); background: rgba(10, 15, 24, .92); border: 1px solid var(--line); border-radius: 6px;
  padding: 28px 26px; display: grid; gap: 18px; backdrop-filter: blur(6px);
}
.eyebrow { font-family: var(--font-display); color: var(--amber); font-size: 12px; letter-spacing: .2em; }
.card h1 { margin: 0; font-weight: 900; font-size: clamp(42px, 10vw, 66px); letter-spacing: .04em; line-height: 1; text-wrap: balance; }
.card h1 span { color: var(--coral); }
.card h2 { margin: 0; font-weight: 900; font-size: 38px; }
.tag { margin: 0; color: var(--muted); line-height: 1.7; max-width: 44ch; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 13px; }
.keys dt { font-family: var(--font-display); white-space: nowrap; }
.keys dd { margin: 0; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stats div { display: grid; gap: 2px; }
.stats b { font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.sens { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.sens input { flex: 1; accent-color: var(--coral); }
.primary {
  font: inherit; font-weight: 700; font-size: 17px; padding: 14px; border: 0; border-radius: 4px;
  background: var(--coral); color: #1a0b09; cursor: pointer; letter-spacing: .1em;
}
.primary:hover { filter: brightness(1.08); }
.primary:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.hint2 { font-size: 12px; color: var(--muted); margin: 0; }
#loading { font-size: 13px; color: var(--muted); }
@media (max-width: 480px) { .stats { grid-template-columns: repeat(2, 1fr); } .keys { font-size: 12px; } }
@media (prefers-reduced-motion: reduce) { #banner.show { animation-duration: .01s; } }
</style>

<div id="app"></div>
<div id="hud" hidden>
  <div id="scope" hidden></div>
  <div id="vignette"></div>
  <div id="dmgDir"></div>
  <div id="crosshair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><span class="dot"></span></div>
  <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
  <div class="hud-tl">
    <div class="wave">第 <b id="waveN">1</b> 波</div>
    <div class="lbl" id="leftN">敵人 0</div>
    <canvas id="radar" width="260" height="260"></canvas>
  </div>
  <div class="hud-tr">
    <div id="score">0</div>
    <div class="lbl">最高 <span id="best">0</span></div>
    <div id="combo"></div>
    <div id="feed"></div>
  </div>
  <div class="hud-bl">
    <div class="hpnum"><b id="hpN">100</b><span class="lbl">HP</span></div>
    <div class="hpbar"><div id="hpFill"></div></div>
    <div class="lbl" id="nadeN">手榴彈 ×2</div>
  </div>
  <div class="hud-br">
    <div id="wName">步槍 T91</div>
    <div class="ammo"><b id="mag">30</b><span id="res">/ 90</span></div>
    <div id="reloadBar"><div id="reloadFill"></div></div>
    <div id="slots"></div>
  </div>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="banner"></div>
</div>
<div id="touch" hidden>
  <div id="zoneL"></div>
  <div id="zoneR"></div>
  <div id="joy" hidden><div id="joyKnob"></div></div>
  <button class="tb" id="tFire" type="button">開火</button>
  <button class="tb" id="tAds" type="button">瞄準</button>
  <button class="tb" id="tJump" type="button">跳</button>
  <button class="tb" id="tReload" type="button">換彈</button>
  <button class="tb" id="tSwap" type="button">換槍</button>
  <button class="tb" id="tNade" type="button">手榴彈</button>
  <button class="tb" id="tPause" type="button" aria-label="暫停">II</button>
</div>
<div id="overlay"><div class="card" id="card"><div id="loading">載入 3D 引擎中…</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) { $('card').innerHTML = '<h2>載入失敗</h2><p class="tag">3D 引擎沒有載入成功，請檢查網路後重新整理頁面。</p>'; return; }

const COARSE = matchMedia('(pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches;
let touchUI = COARSE;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const AX = 30, AZ = 20, EYE = 1.65, PR = 0.4;

// ================= renderer / scene =================
const renderer = new THREE.WebGLRenderer({ antialias: !COARSE, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, COARSE ? 1.25 : 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.autoClear = false;
renderer.shadowMap.enabled = !COARSE;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('app').appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x141a2a, 0.0095);
const BASE_FOV = COARSE ? 72 : 78;
const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.05, 700);
camera.rotation.order = 'YXZ';
scene.add(camera);

// weapon view model renders in its own pass so it never clips into walls
const wScene = new THREE.Scene();
const wCam = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.01, 10);
wScene.add(new THREE.AmbientLight(0x8090b0, 0.75));
const wSun = new THREE.DirectionalLight(0xdfe8ff, 0.9); wSun.position.set(-1, 2, 1); wScene.add(wSun);
const wFlashLight = new THREE.PointLight(0xffc070, 0, 2); wFlashLight.position.set(0.1, -0.05, -0.8); wScene.add(wFlashLight);

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = wCam.aspect = w / h;
  camera.updateProjectionMatrix(); wCam.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);

// ================= textures =================
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const floorTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#4b5b50'; g.fillRect(0, 0, w, h);               // 頂樓綠色防水漆
  for (let i = 0; i < 6000; i++) { const l = Math.random() < .5 ? 0 : 255; g.fillStyle = `rgba(${l},${l},${l},${Math.random() * .07})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  for (let i = 0; i < 16; i++) {
    const x = Math.random() * w, y = Math.random() * h, r = rand(20, 80), gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(18,24,20,.3)'); gr.addColorStop(1, 'rgba(18,24,20,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.strokeStyle = 'rgba(18,26,22,.6)'; g.lineWidth = 3;
  for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * w / 4, 0); g.lineTo(i * w / 4, h); g.stroke(); g.beginPath(); g.moveTo(0, i * h / 4); g.lineTo(w, i * h / 4); g.stroke(); }
}, true);
floorTex.repeat.set((AX * 2) / 8, (AZ * 2 + 5) / 8);
const metalTex = canvasTex(128, 128, (g, w, h) => {                // 鐵皮屋浪板
  for (let x = 0; x < w; x += 16) { const gr = g.createLinearGradient(x, 0, x + 16, 0); gr.addColorStop(0, '#244e78'); gr.addColorStop(.5, '#4a80b3'); gr.addColorStop(1, '#244e78'); g.fillStyle = gr; g.fillRect(x, 0, 16, h); }
  g.fillStyle = 'rgba(130,70,35,.25)'; for (let i = 0; i < 40; i++) g.fillRect(Math.random() * w, Math.random() * h, rand(2, 6), rand(8, 40));
}, true);
metalTex.repeat.set(5, 2);
const concTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#878c88'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * .09})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.fillStyle = 'rgba(30,40,35,.3)'; for (let i = 0; i < 10; i++) g.fillRect(Math.random() * w, h * .5, rand(3, 9), h * .5);
}, true);
const crateTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#7a5a38'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#4e3820'; g.lineWidth = 4;
  for (let y = 0; y < h; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  g.lineWidth = 10; g.strokeRect(5, 5, w - 10, h - 10);
  g.beginPath(); g.moveTo(8, 8); g.lineTo(w - 8, h - 8); g.stroke();
});
function windowTex() {
  return canvasTex(128, 256, (g, w, h) => {
    g.fillStyle = '#0d121a'; g.fillRect(0, 0, w, h);
    const cols = ['#ffd58a', '#ffe8b5', '#a8d4ff', '#ff9f6b', '#fff3d6'];
    for (let y = 6; y < h - 8; y += 16) for (let x = 6; x < w - 8; x += 15) {
      if (Math.random() < .32) { g.fillStyle = cols[Math.floor(Math.random() * cols.length)]; g.globalAlpha = rand(.5, 1); g.fillRect(x, y, 9, 10); }
      else { g.fillStyle = '#18202b'; g.globalAlpha = 1; g.fillRect(x, y, 9, 10); }
    }
    g.globalAlpha = 1;
  }, true);
}
const dotTex = canvasTex(64, 64, (g, w, h) => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(255,255,255,.6)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const flashTex = canvasTex(128, 128, (g, w, h) => {
  g.translate(64, 64);
  for (let i = 0; i < 7; i++) {
    g.rotate(Math.PI * 2 / 7);
    const gr = g.createLinearGradient(0, 0, 60, 0); gr.addColorStop(0, 'rgba(255,240,200,1)'); gr.addColorStop(1, 'rgba(255,150,40,0)');
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, -7); g.lineTo(60, 0); g.lineTo(0, 7); g.fill();
  }
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, 30); gr.addColorStop(0, 'rgba(255,255,230,1)'); gr.addColorStop(1, 'rgba(255,180,60,0)');
  g.fillStyle = gr; g.fillRect(-30, -30, 60, 60);
});
const holeTex = canvasTex(32, 32, (g) => {
  const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, 'rgba(0,0,0,.95)'); gr.addColorStop(.35, 'rgba(10,10,10,.8)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
});
function signTex(text, color, w, h, size) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c);
  const draw = () => {
    const g = c.getContext('2d');
    g.clearRect(0, 0, w, h);
    g.fillStyle = '#0c0709'; g.fillRect(0, 0, w, h);
    g.strokeStyle = color; g.lineWidth = 6; g.shadowColor = color; g.shadowBlur = 24; g.strokeRect(14, 14, w - 28, h - 28);
    g.font = `900 ${size}px "Noto Sans TC", "Microsoft JhengHei", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowBlur = 40; g.fillStyle = color; g.fillText(text, w / 2, h / 2 + size * .04);
    g.shadowBlur = 0; g.fillStyle = 'rgba(255,255,255,.85)'; g.fillText(text, w / 2, h / 2 + size * .04);
    t.needsUpdate = true;
  };
  draw();
  if (document.fonts && document.fonts.load) document.fonts.load(`900 ${size}px "Noto Sans TC"`).then(draw).catch(() => {});
  return t;
}

// ================= collision helpers =================
function pushOut(o, r) {
  for (const c of colliders) {
    const cx = clamp(o.x, c.minX, c.maxX), cz = clamp(o.z, c.minZ, c.maxZ);
    const dx = o.x - cx, dz = o.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 < 1e-9) {
      const l = o.x - c.minX, rr = c.maxX - o.x, t = o.z - c.minZ, b = c.maxZ - o.z, m = Math.min(l, rr, t, b);
      if (m === l) o.x = c.minX - r; else if (m === rr) o.x = c.maxX + r; else if (m === t) o.z = c.minZ - r; else o.z = c.maxZ + r;
    } else { const d = Math.sqrt(d2); o.x = cx + dx / d * r; o.z = cz + dz / d * r; }
  }
  o.x = clamp(o.x, -AX + .4 + r, AX - .4 - r); o.z = clamp(o.z, -AZ + .4 + r, AZ - .4 - r);
}
function pointInBoxes(x, y, z) {
  if (y <= 0) return true;
  for (const c of colliders) if (x > c.minX && x < c.maxX && z > c.minZ && z < c.maxZ && y < c.h) return true;
  return false;
}
const _hit = { t: 0, nx: 0, ny: 0, nz: 0 };
function rayWorld(ox, oy, oz, dx, dy, dz, maxT) {
  let best = maxT, nx = 0, ny = 0, nz = 0;
  if (dy < -1e-6) { const t = -oy / dy; if (t < best) { best = t; nx = 0; ny = 1; nz = 0; } }
  for (const c of colliders) {
    let tmin = 0, tmax = best, ax = -1, sg = 0;
    // x
    if (Math.abs(dx) < 1e-9) { if (ox < c.minX || ox > c.maxX) continue; }
    else { let t1 = (c.minX - ox) / dx, t2 = (c.maxX - ox) / dx, s = -1; if (t1 > t2) { const q = t1; t1 = t2; t2 = q; s = 1; } if (t1 > tmin) { tmin = t1; ax = 0; sg = s; } if (t2 < tmax) tmax = t2; if (tmin > tmax) continue; }
    // y
    if (Math.abs(dy) < 1e-9) { if (oy < 0 || oy > c.h) continue; }
    else { let t1 = (0 - oy) / dy, t2 = (c.h - oy) / dy, s = -1; if (t1 > t2) { const q = t1; t1 = t2; t2 = q; s = 1; } if (t1 > tmin) { tmin = t1; ax = 1; sg = s; } if (t2 < tmax) tmax = t2; if (tmin > tmax) continue; }
    // z
    if (Math.abs(dz) < 1e-9) { if (oz < c.minZ || oz > c.maxZ) continue; }
    else { let t1 = (c.minZ - oz) / dz, t2 = (c.maxZ - oz) / dz, s = -1; if (t1 > t2) { const q = t1; t1 = t2; t2 = q; s = 1; } if (t1 > tmin) { tmin = t1; ax = 2; sg = s; } if (t2 < tmax) tmax = t2; if (tmin > tmax) continue; }
    if (ax < 0 || tmin >= best) continue;
    best = tmin; nx = ax === 0 ? sg : 0; ny = ax === 1 ? sg : 0; nz = ax === 2 ? sg : 0;
  }
  _hit.t = best; _hit.nx = nx; _hit.ny = ny; _hit.nz = nz;
  return _hit;
}
function los(ax, ay, az, bx, by, bz) {
  const dx = bx - ax, dy = by - ay, dz = bz - az, l = Math.hypot(dx, dy, dz) || 1;
  return rayWorld(ax, ay, az, dx / l, dy / l, dz / l, l).t >= l - .05;
}
function raySphere(ox, oy, oz, dx, dy, dz, cx, cy, cz, r) {
  const px = ox - cx, py = oy - cy, pz = oz - cz;
  const b = px * dx + py * dy + pz * dz, c = px * px + py * py + pz * pz - r * r, h = b * b - c;
  if (h < 0) return Infinity;
  const t = -b - Math.sqrt(h);
  return t > 0 ? t : (c < 0 ? 0 : Infinity);
}

const PN = 1000;
const pGeo = new THREE.BufferGeometry(), pPos = new Float32Array(PN * 3), pCol = new Float32Array(PN * 3);
const pVel = new Float32Array(PN * 3), pLife = new Float32Array(PN), pGrav = new Float32Array(PN);

let pIdx = 0;
const _c = new THREE.Color();
function emit(x, y, z, vx, vy, vz, col, life, grav) {
  const i = pIdx; pIdx = (pIdx + 1) % PN;
  pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
  pVel[i * 3] = vx; pVel[i * 3 + 1] = vy; pVel[i * 3 + 2] = vz;
  _c.set(col); pCol[i * 3] = _c.r; pCol[i * 3 + 1] = _c.g; pCol[i * 3 + 2] = _c.b;
  pLife[i] = life; pGrav[i] = grav;
}
function burst(x, y, z, col, n, spd, grav = 9, life = .5) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), e = rand(-.4, 1.2), s = rand(spd * .3, spd);
    emit(x, y, z, Math.cos(a) * Math.cos(e) * s, Math.sin(e) * s, Math.sin(a) * Math.cos(e) * s, col, rand(life * .5, life), grav);
  }
}
function updateParticles(dt) {
  const fade = Math.max(0, 1 - dt * 2.2);
  for (let i = 0; i < PN; i++) {
    if (pLife[i] <= 0) continue;
    pLife[i] -= dt;
    if (pLife[i] <= 0) { pPos[i * 3 + 1] = -999; continue; }
    pVel[i * 3 + 1] -= pGrav[i] * dt;
    pPos[i * 3] += pVel[i * 3] * dt; pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt; pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
    if (pPos[i * 3 + 1] < 0.02) { pPos[i * 3 + 1] = 0.02; pVel[i * 3 + 1] *= -.3; pVel[i * 3] *= .6; pVel[i * 3 + 2] *= .6; }
    pCol[i * 3] *= fade; pCol[i * 3 + 1] *= fade; pCol[i * 3 + 2] *= fade;
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
}

      <div><span class="lbl">命中率</span><b>${acc}%</b></div>
    </div>
    <p class="tag">最高紀錄 ${best.toLocaleString()} 分</p>
    <button class="primary" id="startBtn" type="button">再來一局</button>
    <p class="hint2">按 Enter 也可以重新開始</p>`;
  $('startBtn').addEventListener('click', startGame);
}
function pauseCard() {
  card.innerHTML = `
    <div class="eyebrow">PAUSED</div>
    <h2>暫停中</h2>
    <p class="tag">第 ${wave} 波・${score.toLocaleString()} 分・擊殺 ${kills}</p>
    ${touchUI ? '' : sensRow()}
    <button class="primary" id="resumeBtn" type="button">繼續</button>
    <p class="hint2">${muted ? '音效已關閉（按 M 開啟）' : '按 M 可以關閉音效'}</p>`;
  $('resumeBtn').addEventListener('click', togglePause);
  bindSens();
}
function startGame() {
  ensureAudio();
  reset();
  state = 'play';
  overlay.hidden = true; hudEl.hidden = false; $('touch').hidden = !touchUI;
  camera.fov = BASE_FOV; camera.updateProjectionMatrix();
  fireHeld = adsHeld = adsToggle = false;
  if (!touchUI) requestLock();
}
function togglePause() {
  if (state === 'play' && !P.dead) {
    state = 'pause'; pauseCard(); overlay.hidden = false; fireHeld = adsHeld = false;
    if (document.pointerLockElement) document.exitPointerLock();
  } else if (state === 'pause') {
    state = 'play'; overlay.hidden = true;
    if (!touchUI) requestLock();
  }
}

// ================= menu scene =================
function setupMenu() {
  resetPlayer();
  const demo = [['rusher', -4, 1, 2.6], ['gunner', 5, -2, -2.2], ['brute', -1, -2.5, 3.1]];
  for (const [type, x, z, yaw] of demo) {
    const o = makeEnemyMesh(type); o.g.position.set(x, 0, z); o.g.rotation.y = yaw; scene.add(o.g);
    enemies.push({ type, t: ET[type], o, x, z, base: 0, hp: 1, demo: true });
  }
}

// ================= loop =================
let prev = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - prev) / 1000); prev = now;
  if (state === 'play') { update(dt); updateViewModel(dt); updateHud(dt); }
  else if (state === 'over') { time += dt; updateViewModel(dt); }
  else if (state === 'menu') {
    time += dt;
    const a = time * .06;
    camera.position.set(Math.sin(a) * 22, 6.5 + Math.sin(time * .2) * .6, Math.cos(a) * 16 + 2);
    camera.lookAt(0, 1.4, -3);
  }
  updateAmbient(dt);
  renderer.clear();
  renderer.render(scene, camera);
  if (state === 'play' || state === 'pause' || state === 'over') { renderer.clearDepth(); renderer.render(wScene, wCam); }
  requestAnimationFrame(frame);
}
setupMenu();
menuCard();
requestAnimationFrame(frame);
})();
</script>

</body></html>
